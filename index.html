<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styleindex.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='sun' cx='50%25' cy='72%25' r='60%25'%3E%3Cstop offset='0%25' stop-color='%23ffd59a'/%3E%3Cstop offset='45%25' stop-color='%23f9b872'/%3E%3Cstop offset='100%25' stop-color='%23f0766b'/%3E%3C/radialGradient%3E%3ClinearGradient id='sea' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0%25' stop-color='%235eead4'/%3E%3Cstop offset='100%25' stop-color='%232b8a9e'/%3E%3C/linearGradient%3E%3CclipPath id='disc'%3E%3Ccircle cx='32' cy='32' r='29'/%3E%3C/clipPath%3E%3C/defs%3E%3Cg clip-path='url(%23disc)'%3E%3Crect x='0' y='0' width='64' height='64' fill='url(%23sun)'/%3E%3Crect x='0' y='37' width='64' height='27' fill='url(%23sea)'/%3E%3Crect x='0' y='35.5' width='64' height='3' fill='%23ffffff' opacity='0.85'/%3E%3Crect x='18' y='45' width='28' height='2.4' rx='1.2' fill='%23ffffff' opacity='0.35'/%3E%3Crect x='24' y='52' width='16' height='2.4' rx='1.2' fill='%23ffffff' opacity='0.25'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='29' fill='none' stroke='%2307121c' stroke-width='2.5'/%3E%3C/svg%3E">
    <title>PackCheck</title>
</head>
<body>
    <nav class="navbar" id="mainNav" aria-label="Main navigation">
        <a class="brand" href="index.html">
            <span class="brand-mark" aria-hidden="true"></span>
            PackCheck
        </a>
    </nav>

    <main>
        <section class="hero" aria-labelledby="heroTitle">
            <h1 class="hero-title" id="heroTitle">Where are you going?</h1>
            <p class="hero-sub">Type a destination and we'll take you there.</p>

            <form class="dest-form" id="destForm" autocomplete="off">
                <label class="sr-only" for="destInput">Destination</label>
                <input
                    class="dest-input"
                    id="destInput"
                    type="text"
                    placeholder="Singapore"
                    list="destSuggestions"
                    required
                >
                <datalist id="destSuggestions"></datalist>
                <button class="btn btn--accent dest-go" type="submit">Go</button>
            </form>

            <div class="dest-chips" id="destChips">
                <button type="button" class="chip" data-place="Singapore">Singapore</button>
                <button type="button" class="chip" data-place="Tokyo">Tokyo</button>
                <button type="button" class="chip" data-place="Paris">Paris</button>
                <button type="button" class="chip" data-place="New York">New York</button>
                <button type="button" class="chip" data-place="Sydney">Sydney</button>
            </div>

            <p class="dest-status" id="destStatus" aria-live="polite"></p>

            <div class="globe-wrap">
                <canvas id="globe" role="img" aria-label="Spinning globe"></canvas>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; <span id="copyrightYear">2026</span> Vivaan Singh. All rights reserved.</p>
    </footer>

    <script>
        const mainNav = document.getElementById("mainNav");
        const updateNav = () => mainNav.classList.toggle("scrolled", window.scrollY > 40);
        window.addEventListener("scroll", updateNav, { passive: true });
        updateNav();

        // Keep the copyright year current
        document.getElementById("copyrightYear").textContent = new Date().getFullYear();
    </script>

    <!-- Globe: d3 for the map projection, topojson for the world shapes -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
    <script src="globe.js"></script>
</body>
</html>
